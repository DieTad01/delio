# Nginx — sitio de Delio
#
# Dónde va este archivo en el VPS (Debian):
#   /etc/nginx/sites-available/delio   y un enlace a él en /etc/nginx/sites-enabled/
#
# Este archivo sí se sube a GitHub: no trae contraseñas ni llaves, y es la
# forma de que llegue al servidor. Los certificados de HTTPS los guarda
# Certbot en /etc/letsencrypt, fuera de esta carpeta.
#
# El dominio es delioph.tech; si cambia, se cambia en server_name.
# Empieza solo con el puerto 80; Certbot agrega el 443 (HTTPS) por su cuenta.

# Freno para el panel: cada dirección IP puede hacer 60 peticiones por minuto a /api/.
# Sobra para usar el panel y estorba a quien quiera probar contraseñas o llenar el formulario.
limit_req_zone $binary_remote_addr zone=delio_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name delioph.tech www.delioph.tech;

    # Carpeta donde quedó el proyecto en el VPS
    root /var/www/delio;
    index index.html;

    # Un registro de visitas solo de este sitio. De aquí cuenta las visitas el panel
    # (servidor/visitas.py); si el VPS tiene otros sitios, no se mezclan.
    access_log /var/log/nginx/delio.access.log;

    # El panel (panel.html) le habla a un programa en Python que corre en este mismo
    # VPS, en el puerto 8765 (carpeta servidor/). Ese puerto no está abierto a internet:
    # Nginx es el único que le pasa las peticiones, y solo las que empiezan con /api/.
    location ^~ /api/ {
        limit_req zone=delio_api burst=30 nodelay;
        client_max_body_size 2m;   # lo más grande que llega es el archivo del Cotizador

        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        # La IP real de quien visita; el programa la usa para sus propios frenos.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # js/detalle.js pide esta dirección cuando alguien abre un servicio. No entrega nada
    # (204 = "recibido, sin contenido"); lo que importa es el renglón que deja en el registro.
    location = /visto {
        return 204;
    }

    # Sirve el archivo pedido; si no existe, 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Estos archivos viven en la carpeta pero no son parte del sitio.
    location ^~ /nginx/ { return 404; }
    location ^~ /logo/  { return 404; }
    location ^~ /servidor/ { return 404; }
    location = /README.md { return 404; }
    # Archivos ocultos (.git, .env…), menos .well-known, que Certbot necesita.
    location ~ /\.(?!well-known) { return 404; }

    # El navegador guarda CSS, JS y SVG una hora: en visitas seguidas no los vuelve a pedir.
    # (Si cambias un archivo y no ves el cambio: Ctrl + F5.)
    location ~* \.(css|js|svg)$ {
        expires 1h;
    }

    # Las imágenes PNG casi nunca cambian: se guardan un mes.
    location ~* \.(png|ico)$ {
        expires 30d;
    }

    # Comprimir texto: viajan menos datos y la página carga más rápido.
    # El HTML siempre se comprime; aquí se suman CSS, JS y SVG.
    # (JavaScript aparece con dos nombres porque cambia según la versión de Nginx.)
    gzip on;
    gzip_comp_level 6;      # del 1 al 9: qué tanto se esfuerza en comprimir
    gzip_min_length 512;    # los archivos muy chicos no vale la pena comprimirlos
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Lista blanca de lo que el navegador puede cargar en estas páginas: solo archivos
    # de este mismo sitio. Si alguien lograra colar código en el panel, el navegador se
    # niega a ejecutarlo y a mandar datos a otro lado. (Funciona porque el HTML no trae
    # estilos ni scripts escritos adentro.) El formulario sí puede enviarse a wa.me.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; form-action 'self' https://wa.me; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # El sitio no usa cámara, micrófono ni ubicación: se le dice al navegador que no los ofrezca.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
